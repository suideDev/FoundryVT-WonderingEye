name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write release manifest and zip
        run: |
          python3 - <<'PY'
          import json, os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          with open("module.json", encoding="utf-8") as handle:
              data = json.load(handle)
          data["version"] = version
          data["url"] = f"https://github.com/{repo}"
          data["bugs"] = f"https://github.com/{repo}/issues"
          data["manifest"] = f"https://github.com/{repo}/releases/latest/download/module.json"
          data["download"] = f"https://github.com/{repo}/releases/download/v{version}/module.zip"
          with open("module.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
              handle.write("\n")
          PY
          mkdir -p package/wondering-eye
          rsync -a --exclude package --exclude .git --exclude .github --exclude .gitignore . package/wondering-eye/
          (cd package && zip -r ../module.zip wondering-eye)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
